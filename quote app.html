<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Generator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      h1 {
        text-align: center;
      }
      form {
        max-width: 800px;
        margin: 0 auto;
      }
      .section {
        margin-bottom: 20px;
      }
      .section div {
        margin-bottom: 10px;
      }
      label {
        display: block;
        margin: 5px 0;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 4px;
      }
      button:hover {
        background-color: #218838;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }
      table,
      th,
      td {
        border: 1px solid #ddd;
      }
      th,
      td {
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      .highlight {
        background-color: yellow;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>New Equipment Sales Quote</h1>
    <div style="text-align: center; margin-bottom: 20px">
      <button onclick="importData()">Import Data</button>
      <input
        type="file"
        id="import-file"
        style="display: none"
        accept=".json"
        onchange="handleFile(event)"
      />
    </div>
    <form id="quote-form">
      <div class="section">
        <h2>Customer Information</h2>
        <label for="business-name">Business Name</label>
        <input type="text" id="business-name" name="business-name" required />

        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first-name" required />

        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name" required />

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required />

        <label for="contact-number">Contact Number</label>
        <input type="tel" id="contact-number" name="contact-number" required />
      </div>

      <div class="section">
        <h2>Company Information</h2>
        <label for="address">Address</label>
        <input type="text" id="address" name="address" required />

        <label for="city">City</label>
        <input type="text" id="city" name="city" required />

        <label for="state">State</label>
        <input type="text" id="state" name="state" required />

        <label for="zip-code">ZIP Code</label>
        <input type="text" id="zip-code" name="zip-code" required />

        <label for="tax-rate">Tax Rate</label>
        <input type="text" id="tax-rate" name="tax-rate" required />
      </div>

      <div class="section">
        <h2>Details</h2>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Machine</th>
              <th>Serial Number</th>
              <th>Price</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="machine-details">
            <tr>
              <td>1</td>
              <td><input type="text" name="machine[]" required /></td>
              <td><input type="text" name="serial-number[]" required /></td>
              <td>
                <input type="number" name="price[]" step="0.01" required />
              </td>
              <td>
                <button type="button" onclick="removeRow(this)">Remove</button>
              </td>
            </tr>
          </tbody>
        </table>
        <button type="button" onclick="addRow('machine-details')">
          Add Machine
        </button>
      </div>

      <div class="section">
        <h2>Attachments</h2>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Serial Number</th>
              <th>Price</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="attachments">
            <tr>
              <td>1</td>
              <td>
                <input type="text" name="attachment-serial-number[]" required />
              </td>
              <td>
                <input
                  type="number"
                  name="attachment-price[]"
                  step="0.01"
                  required
                />
              </td>
              <td>
                <button type="button" onclick="removeRow(this)">Remove</button>
              </td>
            </tr>
          </tbody>
        </table>
        <button type="button" onclick="addRow('attachments')">
          Add Attachment
        </button>
      </div>

      <div class="section">
        <h2>Summary</h2>
        <label for="rebate">Rebate</label>
        <input type="number" id="rebate" name="rebate" step="0.01" />

        <label for="sales-tax">Sales Tax (%)</label>
        <input type="number" id="sales-tax" name="sales-tax" step="0.01" />

        <div class="flex-row">
          <div>
            <label for="sub-total">Sub Total</label>
            <input type="number" id="sub-total" name="sub-total" readonly />
          </div>
          <div>
            <label for="final-price">Final Price</label>
            <input type="number" id="final-price" name="final-price" readonly />
          </div>
        </div>
      </div>

      <div style="text-align: center; margin-bottom: 20px">
        <button type="button" onclick="generateQuote()">Generate Quote</button>
        <button onclick="exportData()">Export Data</button>
      </div>
    </form>

    <script>
      function addRow(tableId) {
        const table = document.getElementById(tableId);
        const newRow = table.insertRow();
        const rowCount = table.rows.length;
        newRow.innerHTML = `
                <td>${rowCount}</td>
                <td><input type="text" name="machine[]" required /></td>
                <td><input type="text" name="serial-number[]" required /></td>
                <td><input type="number" name="price[]" step="0.01" required /></td>
                <td><button type="button" onclick="removeRow(this)">Remove</button></td>
            `;
        updateRowNumbers(tableId);
      }

      function removeRow(button) {
        const row = button.closest("tr");
        const tableId = row.parentNode.id;
        row.remove();
        updateRowNumbers(tableId);
      }

      function updateRowNumbers(tableId) {
        const table = document.getElementById(tableId);
        Array.from(table.rows).forEach((row, index) => {
          row.cells[0].innerText = index + 1;
        });
      }

      function exportData() {
        const form = document.getElementById("quote-form");
        const formData = new FormData(form);
        const data = {};

        formData.forEach((value, key) => {
          if (!data[key]) {
            data[key] = value;
          } else {
            if (!Array.isArray(data[key])) {
              data[key] = [data[key]];
            }
            data[key].push(value);
          }
        });

        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "quote-data.json";
        link.click();
      }

      function importData() {
        document.getElementById("import-file").click();
      }

      function handleFile(event) {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const data = JSON.parse(e.target.result);

            Object.keys(data).forEach((key) => {
              const inputs = document.getElementsByName(key);

              if (Array.isArray(data[key]) && key === "machine[]") {
                populateRows(
                  "machine-details",
                  data[key],
                  "machine[]",
                  "serial-number[]",
                  "price[]"
                );
              } else if (
                Array.isArray(data[key]) &&
                key === "attachment-serial-number[]"
              ) {
                populateRows(
                  "attachments",
                  data[key],
                  "attachment-serial-number[]",
                  "attachment-price[]"
                );
              } else if (inputs[0] && !Array.isArray(data[key])) {
                inputs[0].value = data[key];
              }
            });
          };
          reader.readAsText(file);
        }
      }

      function populateRows(tableId, rows, ...fields) {
        const table = document.getElementById(tableId);

        // Clear existing rows
        table.innerHTML = "";

        rows.forEach((_, index) => {
          const newRow = table.insertRow();
          newRow.innerHTML = `
                    <td>${index + 1}</td>
                    ${fields
                      .map(
                        (field) =>
                          `<td><input type="text" name="${field}" value="${
                            rows[index][field.replace("[]", "")] || ""
                          }"/></td>`
                      )
                      .join("")}
                    <td><button type="button" onclick="removeRow(this)">Remove</button></td>
                `;
        });

        updateRowNumbers(tableId);
      }

      function generateQuote() {
        const form = document.getElementById("quote-form");
        const formData = new FormData(form);

        // Collect Customer Information
        const customerInfo = `
        <h2>Customer Information</h2>
        <p>
            Business Name: ${formData.get("business-name")}<br>
            First Name: ${formData.get("first-name")}<br>
            Last Name: ${formData.get("last-name")}<br>
            Email: ${formData.get("email")}<br>
            Contact Number: ${formData.get("contact-number")}<br>
        </p>
    `;

        // Collect Company Information
        const companyInfo = `
        <h2>Company Information</h2>
        <p>
            Address: ${formData.get("address")}<br>
            City: ${formData.get("city")}<br>
            State: ${formData.get("state")}<br>
            ZIP Code: ${formData.get("zip-code")}<br>
            Tax Rate: ${formData.get("tax-rate")}%<br>
        </p>
    `;

        // Collect Machine Details
        const machineDetailsRows = Array.from(
          document.querySelectorAll("#machine-details tr")
        )
          .map((row, index) => {
            const machine = row.querySelector('input[name="machine[]"]').value;
            const serialNumber = row.querySelector(
              'input[name="serial-number[]"]'
            ).value;
            const price =
              parseFloat(row.querySelector('input[name="price[]"]').value) || 0;
            return `<tr><td>${
              index + 1
            }</td><td>${machine}</td><td>${serialNumber}</td><td>${price.toFixed(
              2
            )}</td></tr>`;
          })
          .join("");

        const machineDetails = `
        <h2>Details</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Machine</th>
                    <th>Serial Number</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                ${machineDetailsRows}
            </tbody>
        </table>
    `;

        // Collect Attachments
        const attachmentRows = Array.from(
          document.querySelectorAll("#attachments tr")
        )
          .map((row, index) => {
            const serialNumber = row.querySelector(
              'input[name="attachment-serial-number[]"]'
            ).value;
            const price =
              parseFloat(
                row.querySelector('input[name="attachment-price[]"]').value
              ) || 0;
            return `<tr><td>${
              index + 1
            }</td><td>${serialNumber}</td><td>${price.toFixed(2)}</td></tr>`;
          })
          .join("");

        const attachments = `
        <h2>Attachments</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Serial Number</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                ${attachmentRows}
            </tbody>
        </table>
    `;

        // Calculate Summary
        const machineTotal = Array.from(
          document.querySelectorAll('#machine-details input[name="price[]"]')
        ).reduce((sum, input) => sum + (parseFloat(input.value) || 0), 0);
        const attachmentTotal = Array.from(
          document.querySelectorAll(
            '#attachments input[name="attachment-price[]"]'
          )
        ).reduce((sum, input) => sum + (parseFloat(input.value) || 0), 0);
        const rebate = parseFloat(formData.get("rebate")) || 0;
        const subTotal = machineTotal + attachmentTotal - rebate;
        const salesTaxRate = parseFloat(formData.get("sales-tax")) / 100 || 0;
        const salesTax = subTotal * salesTaxRate;
        const finalPrice = subTotal + salesTax;

        const summary = `
        <h2>Summary</h2>
        <table>
            <tr><td>Rebate:</td><td>$${rebate.toFixed(2)}</td></tr>
            <tr><td>Sub Total:</td><td>$${subTotal.toFixed(2)}</td></tr>
            <tr><td>Sales Tax:</td><td>$${salesTax.toFixed(2)}</td></tr>
            <tr><td><strong>Final Price:</strong></td><td class="highlight">$${finalPrice.toFixed(
              2
            )}</td></tr>
        </table>
    `;

        // Signature Section
        const signatureSection = `
        <h2>Signature</h2>
        <p>______________________________</p>
        <p>Authorized Signature</p>
    `;

        // Open New Window for Generated Quote
        const quoteWindow = window.open("", "", "width=800,height=600");
        quoteWindow.document.write(`
        <html>
        <head>
            <title>Generated Quote</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 20px; }
                h1, h2 { text-align: center; }
                table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
                table, th, td { border: 1px solid #ddd; }
                th, td { padding: 8px; text-align: left; }
                th { background-color: #f2f2f2; }
                .highlight { background-color: yellow; font-weight: bold; }
                button { display: block; margin: 20px auto; padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
                button:hover { background-color: #218838; }
            </style>
        </head>
        <body>
            <h1>New Equipment Sales Quote</h1>
            ${customerInfo}
            ${companyInfo}
            ${machineDetails}
            ${attachments}
            ${summary}
            ${signatureSection}
            <button onclick="window.print()">Print Quote</button>
        </body>
        </html>
    `);
        quoteWindow.document.close();
      }
    </script>
  </body>
</html>
